name: fetch-cta-ndx
on:
  schedule:
    - cron: "30 22 * * 1-5"  # 07:30 KST, after the US close
    - cron: "30 1 * * 2-6"   # 10:30 KST backup
  workflow_dispatch:
  push:
    paths:
      - fetch_cta.py
      - .github/workflows/fetch-cta.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance finance-datareader pandas numpy
      - run: python fetch_cta.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898242+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "cta data: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
