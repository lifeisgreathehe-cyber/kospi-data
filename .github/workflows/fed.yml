name: fetch-fed
on:
  schedule:
    - cron: "15 19 * * *"   # 04:15 KST daily (FOMC statements come out ~03:00/04:00 KST)
    - cron: "15 22 * * *"   # 07:15 KST backup
  push:
    branches: ["claude/**"]
    paths: ["fed_fetch.py", ".github/workflows/fed.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4 lxml
      - run: python fed_fetch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898242+github-actions[bot]@users.noreply.github.com"
          git add data/fed
          git diff --cached --quiet || git commit -m "fed: $(date -u +%F)"
          git pull --rebase -q || true
          git push
