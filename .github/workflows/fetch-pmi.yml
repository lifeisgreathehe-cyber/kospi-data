name: fetch-pmi
on:
  schedule:
    - cron: "30 15 1-9 * *"   # ISM releases: manufacturing 1st business day, services 3rd (10:00 ET)
    - cron: "30 23 1-9 * *"   # backup
  push:
    branches: [claude/project-thread-5rfgp7]
    paths: [pmi/**, .github/workflows/fetch-pmi.yml]
  workflow_dispatch:
    inputs:
      deep:
        description: "Scan several PR Newswire listing pages (backfill)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4
      - run: python pmi/fetch.py ${{ (github.event_name == 'push' || inputs.deep) && '--deep' || '' }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898242+github-actions[bot]@users.noreply.github.com"
          git add data/pmi
          git diff --cached --quiet || git commit -m "pmi: $(date -u +%F)"
          git pull --rebase -q || true
          git push
