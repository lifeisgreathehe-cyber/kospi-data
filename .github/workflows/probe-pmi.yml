name: probe-pmi
on:
  push:
    branches: [claude/project-thread-5rfgp7]
    paths: [probe_pmi.py, .github/workflows/probe-pmi.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: python probe_pmi.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898242+github-actions[bot]@users.noreply.github.com"
          git add data/pmi
          git diff --cached --quiet || git commit -m "pmi probe"
          git push
